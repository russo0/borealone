<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="icon" type="image/png" href="favicon.png">
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-[#0b0f19] text-gray-200 font-sans antialiased min-h-screen flex flex-col">

<!-- HEADER -->
<nav class="border-b border-gray-900 bg-[#070b14]/80 backdrop-blur sticky top-0 z-50">
    <div class="max-w-6xl mx-auto px-4 min-h-16 py-3 sm:py-0 flex flex-wrap items-center justify-between gap-y-3">

        <!-- LOGO -->
        <a href="https://borealone.com" class="flex items-center space-x-3 group order-1">
            <img src="logo-icon.png" class="w-8 h-8 rounded-full object-cover border border-white/10 shadow-sm">
            <span class="font-bold text-xs sm:text-lg tracking-wider text-white group-hover:text-gray-400 transition">
                BOREAL ONE AB
            </span>
        </a>

        <!-- LANGUAGE SELECTOR -->
        <div class="flex space-x-2 bg-gray-950 p-1 rounded border border-gray-800 order-2 sm:order-3">
            <button onclick="setLanguage('en')" id="btn-en" class="p-1 rounded transition flex items-center justify-center">
                <img src="flags/uk.svg" class="w-7 h-7 rounded-full">
            </button>
            <button onclick="setLanguage('sv')" id="btn-sv" class="p-1 rounded transition flex items-center justify-center">
                <img src="flags/sweden.svg" class="w-7 h-7 rounded-full">
            </button>
            <button onclick="setLanguage('pt')" id="btn-pt" class="p-1 rounded transition flex items-center justify-center">
                <img src="flags/brazil.svg" class="w-7 h-7 rounded-full">
            </button>
            <button onclick="setLanguage('es')" id="btn-es" class="p-1 rounded transition flex items-center justify-center">
                <img src="flags/spain.svg" class="w-7 h-7 rounded-full">
            </button>
        </div>

        <!-- NAV LINKS -->
        <div class="w-full sm:w-auto flex items-center justify-between sm:justify-start space-x-4 text-[11px] sm:text-xs font-medium order-3 sm:order-2 border-t border-gray-900/60 pt-2 sm:pt-0 sm:border-none">
            <a href="https://cyber.borealone.com" id="nav-cyber-link" class="text-gray-400 hover:text-white py-1 transition uppercase tracking-wider sm:normal-case">
                Cybersecurity & IT →
            </a>
            <a href="https://media.borealone.com" id="nav-media-link" class="text-aurora hover:text-white py-1 transition uppercase tracking-wider sm:normal-case font-bold">
                Media & Photography →
            </a>
        </div>

    </div>
</nav>

<!-- PAGE CONTENT -->
<main class="max-w-3xl mx-auto px-4 py-12">

    <h1 id="arrival-title" class="text-3xl md:text-5xl font-extrabold text-white mb-8 text-center"></h1>
    <p id="arrival-intro" class="text-gray-300 text-center mb-12"></p>

    <!-- BEFORE ARRIVE -->
    <section class="mb-12">
        <h2 id="before-title" class="text-xl font-bold text-white mb-2"></h2>
        <p id="before-text" class="text-gray-300"></p>
    </section>

    <!-- UNLOCK DOOR -->
    <section class="mb-12">
        <h2 id="unlock-title" class="text-xl font-bold text-white mb-4"></h2>

        <p id="step1-text" class="text-gray-300 mb-4"></p>
        <img src="keypad.jpg" class="rounded-lg border border-white/10 shadow mb-2">
        <p class="text-gray-400 text-sm">The keypad is outside, beside the front door.</p>

        <p id="step2-text" class="text-gray-300 mb-4"></p>
        <p id="step3-text" class="text-gray-300 mb-4"></p>
    </section>

    <!-- LOCK WHEN LEAVING -->
    <section class="mb-12">
        <h2 id="lock-title" class="text-xl font-bold text-white mb-2"></h2>
        <p id="lock-text" class="text-gray-300"></p>
    </section>

    <!-- INSIDE LOCK -->
    <section class="mb-12">
        <h2 id="inside-title" class="text-xl font-bold text-white mb-2"></h2>
        <img src="lock-knob.jpg" class="rounded-lg border border-white/10 shadow mb-2">
        <p id="inside-text" class="text-gray-300"></p>
        <p class="text-gray-400 text-sm">Press the centre of the round knob — not the handle.</p>
    </section>

    <!-- GARAGE -->
    <section class="mb-12">
        <h2 id="garage-title" class="text-xl font-bold text-white mb-2"></h2>
        <p id="garage-text" class="text-gray-300"></p>
    </section>

    <!-- HELP -->
    <section class="mb-12">
        <h2 id="help-title" class="text-xl font-bold text-white mb-2"></h2>
        <p id="help-text" class="text-gray-300"></p>
    </section>

    <!-- DOWNLOAD PDF -->
    <p class="mt-10 text-center">
        <a href="Yellow_Aurora_House_Arrival_Guide.pdf" download id="download-btn"
           class="inline-block bg-white text-black font-semibold text-sm px-6 py-3 rounded-md hover:bg-gray-200 transition shadow-lg"></a>
    </p>

</main>

<!-- FOOTER -->
<footer class="w-full py-16 text-center px-4">
    <div class="max-w-3xl mx-auto">
        <h2 id="footer-title" class="text-xl font-bold text-white mb-2 drop-shadow"></h2>
        <p id="footer-desc" class="text-gray-200 text-sm mb-6 max-w-sm mx-auto drop-shadow"></p>

        <a href="mailto:info@borealone.com" id="footer-btn"
           class="inline-block bg-white text-black font-semibold text-sm px-6 py-3 rounded-md hover:bg-gray-200 transition shadow-lg"></a>

        <p id="footer-rights" class="text-xs text-gray-400/50 mt-12"></p>
    </div>
</footer>

/* APPLY LANGUAGE */
function setLanguage(lang) {
    localStorage.setItem("arrivalLang", lang);
    highlightButton(lang);

    const t = translationsArrival[lang];
    const f = translations[lang];

    document.getElementById("arrival-title").textContent = t.arrivalTitle;
    document.getElementById("arrival-intro").textContent = t.arrivalIntro;

    document.getElementById("before-title").textContent = t.beforeTitle;
    document.getElementById("before-text").textContent = t.beforeText;

    document.getElementById("unlock-title").textContent = t.unlockTitle;
    document.getElementById("step1-text").textContent = t.step1Text;
    document.getElementById("step2-text").textContent = t.step2Text;
    document.getElementById("step3-text").textContent = t.step3Text;

    document.getElementById("lock-title").textContent = t.lockTitle;
    document.getElementById("lock-text").textContent = t.lockText;

    document.getElementById("inside-title").textContent = t.insideTitle;
    document.getElementById("inside-text").textContent = t.insideText;

    document.getElementById("garage-title").textContent = t.garageTitle;
    document.getElementById("garage-text").textContent = t.garageText;

    document.getElementById("help-title").textContent = t.helpTitle;
    document.getElementById("help-text").textContent = t.helpText;

    document.getElementById("download-btn").textContent = t.downloadBtn;

    document.getElementById("nav-media-link").textContent = f.mediaLink;
    document.getElementById("nav-cyber-link").textContent = f.cyberLink;

    document.getElementById("footer-title").textContent = f.footerTitle;
    document.getElementById("footer-desc").textContent = f.footerDesc;
    document.getElementById("footer-btn").textContent = f.footerBtn;
    document.getElementById("footer-rights").textContent = f.footerRights;
}

/* LOAD SAVED LANGUAGE */
document.addEventListener("DOMContentLoaded", () => {
    const saved = localStorage.getItem("arrivalLang") || "en";
    setLanguage(saved);
});
